# Workflow to build and release G4™ UiaPeek for production
name: Build & Release

# Define permissions for the workflow
permissions:
  contents: write
  checks: write
  pull-requests: write
  statuses: write

# Trigger the workflow on push to the main branch
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

# Set environment variables
env:
  artifactStagingDirectory: ${{ github.workspace }}/artifact_staging
  artifactType: 'Production'
  binariesDirectory: ${{ github.workspace }}/binaries
  buildConfiguration: 'Release'
  buildPlatform: 'any cpu'
  chromiumPeekProjectName: ChromiumPeek
  uiaPeekProjectName: UiaPeek

# Default settings for all run steps
defaults:
  run:
    working-directory: src

# Define jobs for the workflow
jobs:
  # Job to get the version of the build
  new-version:
    name: New Version
    runs-on: windows-latest

    # Outputs of the job
    outputs:
      buildVersion: ${{ steps.parse-version.outputs.version }}
      validVersion: ${{ steps.validate-version.outputs.valid }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # Step to parse the build version for GitHub tag
    - name: Parse Build Version for GitHub Tag
      id: parse-version
      shell: pwsh
      run: echo "version=$(Get-Date -UFormat '%Y.%m.%d').${{ github.run_number }}" >> $env:GITHUB_OUTPUT

    # Step to validate the parsed version
    - name: Validate Version ${{ steps.parse-version.outputs.version }}
      id: validate-version
      shell: pwsh
      run: |
        $version = "${{ steps.parse-version.outputs.version }}"
        echo "valid=$($version -match '^\d+(\.\d+){3}$')" >> $env:GITHUB_OUTPUT

  # Job to build and publish UiaPeek
  build-uia-peek:
    name: Build & Publish UiaPeek Version ${{ needs.new-version.outputs.buildVersion }}
    runs-on: windows-latest
    needs: new-version
    if: ${{ needs.new-version.result == 'success' && needs.new-version.outputs.validVersion == 'True' }}

    # Outputs of the job
    outputs:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}
    
    # Set environment variables specific to the build job
    env:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}
    
    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4
      
    # Step to setup .NET Core SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    # Step to restore packages
    - name: Restore Packages
      shell: pwsh
      run: dotnet restore ${{ env.uiaPeekProjectName }}/${{ env.uiaPeekProjectName }}.csproj

    # Add msbuild to PATH to ensure that MSBuild is available for the build and publish steps
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    # Step to publish the project
    - name: Publish
      shell: pwsh
      run: msbuild ${{ env.uiaPeekProjectName }}/${{ env.uiaPeekProjectName }}.csproj /t:Publish /p:Configuration=Release /p:PublishDir=${{ env.binariesDirectory }}/publish/

    # Step to create a build artifact
    - name: Create Build Artifact
      shell: pwsh
      run: |
        New-Item -Path "${{ env.artifactStagingDirectory }}" -ItemType Directory
        Compress-Archive `
            -Path ${{ env.binariesDirectory }}/${{ env.uiaPeekProjectName }}/publish/* `
            -DestinationPath ${{ env.artifactStagingDirectory }}/${{ env.uiaPeekProjectName }}.${{ env.buildVersion }}-win-x64.zip 

    # Step to upload the build artifact
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: uia-peek-drop
        path: ${{ env.artifactStagingDirectory }}/*.zip

  # Job to build and publish ChromiumPeek
  build-chromium-peek:
    name: Build & Publish ChromiumPeek Version ${{ needs.new-version.outputs.buildVersion }}
    runs-on: windows-latest
    needs: new-version
    if: ${{ needs.new-version.result == 'success' && needs.new-version.outputs.validVersion == 'True' }}

    # Outputs of the job
    outputs:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}
    
    # Set environment variables specific to the build job
    env:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}
    
    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4
      
    # Step to setup .NET Core SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    # Step to restore packages
    - name: Restore Packages
      shell: pwsh
      run: dotnet restore ${{ env.chromiumPeekProjectName }}/${{ env.chromiumPeekProjectName }}.csproj

    # Step to publish the project
    - name: Publish
      shell: pwsh
      run: dotnet publish ${{ env.chromiumPeekProjectName }}/${{ env.chromiumPeekProjectName }}.csproj --configuration ${{ env.buildConfiguration }} --output ${{ env.binariesDirectory }}/${{ env.chromiumPeekProjectName }}/publish

    # Step to create a build artifact
    - name: Create Build Artifact
      shell: pwsh
      run: |
        New-Item -Path "${{ env.artifactStagingDirectory }}" -ItemType Directory
        Compress-Archive `
            -Path ${{ env.binariesDirectory }}/${{ env.chromiumPeekProjectName }}/publish/* `
            -DestinationPath ${{ env.artifactStagingDirectory }}/${{ env.chromiumPeekProjectName }}.${{ env.buildVersion }}.zip 

    # Step to upload the build artifact
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: chromium-peek-drop
        path: ${{ env.artifactStagingDirectory }}/*.zip

  # Job to create a GitHub release and tag the new version
  create-release:
    name: New GitHub Release Version ${{ needs.new-version.outputs.buildVersion }}
    runs-on: windows-latest
    needs: 
      - new-version
      - build-uia-peek
      - build-chromium-peek
    if: success()

    # Set environment variables specific to the release job
    env:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step to download UiaPeek build artifacts
    - name: Download UiaPeek Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: uia-peek-drop

    # Step to download ChromiumPeek build artifacts
    - name: Download ChromiumPeek Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: chromium-peek-drop

    # Step to create a GitHub release and tag
    - name: Create GitHub Release & Tag v${{ env.buildVersion }}
      uses: softprops/action-gh-release@v2
      with:
        files: ./*.zip
        tag_name: v${{ env.buildVersion }}
        name: ${{ env.artifactType }} v${{ env.buildVersion }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
